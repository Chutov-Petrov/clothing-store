{% extends "base.html" %}
{% block title %}Смена пароля — Ткань{% endblock %}
{% block content %}
<div class="panel narrow">
  <h2 style="font-size:20px">Смена пароля</h2>
  <form class="form" method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Текущий пароль<input type="password" name="old" required autofocus></label>
    <label>Новый пароль (мин. 8 символов, заглавная, строчная, цифра)<input type="password" name="new" required minlength="8"></label>
    <label>Повторите новый пароль<input type="password" name="new2" required minlength="8"></label>
    <button class="btn p">Сменить пароль</button>
    <a class="btn" href="{{ url_for('auth.profile') }}">Отмена</a>
  </form>
</div>
{% endblock %}
